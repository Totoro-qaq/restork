name: Release candidate

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write
  attestations: write

jobs:
  build-and-attest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run bandit -q -r src
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
      - run: uv run python scripts/audit_readme.py README.md
      - run: ./scripts/scan-public-artifacts.sh
      - run: uv run python scripts/build_release.py --output dist/release
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/release/*.whl
            dist/release/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-release-candidate
          path: dist/release/
          if-no-files-found: error
          retention-days: 30
