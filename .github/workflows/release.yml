name: Protected release

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

concurrency:
  group: protected-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-release-ref:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-alpha.')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require an annotated SemVer tag on the checked-out commit
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([+-][A-Za-z0-9.-]+)?$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"

  source-release:
    needs: validate-release-ref
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run bandit -q -r src
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
      - run: uv run python scripts/audit_readme.py README.md README.zh-CN.md
      - run: ./scripts/scan-public-artifacts.sh
      - run: uv run python scripts/build_release.py --output dist/release
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/release/*.whl
            dist/release/*.tar.gz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-source-release
          path: dist/release/
          if-no-files-found: error
          retention-days: 30

  desktop-macos:
    needs: validate-release-ref
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-macos
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - name: Require protected macOS and updater credentials
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          for variable in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD RESTORK_UPDATER_PUBLIC_KEY RESTORK_UPDATER_ENDPOINT; do
            test -n "${!variable:-}" || { echo "Missing protected release credential: $variable" >&2; exit 1; }
          done
      - name: Import Developer ID certificate
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          keychain="$RUNNER_TEMP/restork-build.keychain-db"
          certificate="$RUNNER_TEMP/restork-certificate.p12"
          keychain_password="$(openssl rand -base64 32)"
          printf '%s' "$APPLE_CERTIFICATE" | openssl base64 -d -A > "$certificate"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$certificate" -k "$keychain" -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$keychain_password" "$keychain"
          security list-keychains -d user -s "$keychain"
          rm -f "$certificate"
      - name: Build signed, notarized, stapled updater artifacts
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/desktop_release.py config --platform macos --output build/desktop-release-config.json
          npm --prefix desktop exec tauri build -- --config ../build/desktop-release-config.json
      - name: Verify Developer ID, Gatekeeper, notarization, and stapling
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Restork.app"
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          xcrun stapler validate "$dmg"
      - name: Stage macOS release assets
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/desktop-macos
          cp desktop/src-tauri/target/release/bundle/dmg/*.dmg dist/desktop-macos/
          cp desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz dist/desktop-macos/
          cp desktop/src-tauri/target/release/bundle/macos/*.app.tar.gz.sig dist/desktop-macos/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/desktop-macos/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-macos-signed
          path: dist/desktop-macos/
          if-no-files-found: error
          retention-days: 30

  desktop-windows:
    needs: validate-release-ref
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release-windows
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - name: Require protected Windows and updater credentials
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          RESTORK_WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('WINDOWS_CERTIFICATE','WINDOWS_CERTIFICATE_PASSWORD','RESTORK_WINDOWS_TIMESTAMP_URL','TAURI_SIGNING_PRIVATE_KEY','TAURI_SIGNING_PRIVATE_KEY_PASSWORD','RESTORK_UPDATER_PUBLIC_KEY','RESTORK_UPDATER_ENDPOINT')) {
            if ([string]::IsNullOrWhiteSpace((Get-Item "env:$name").Value)) { throw "Missing protected release credential: $name" }
          }
      - name: Import Authenticode certificate
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          $ErrorActionPreference = 'Stop'
          $certificatePath = Join-Path $env:RUNNER_TEMP 'restork-code-signing.pfx'
          [IO.File]::WriteAllBytes($certificatePath, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
          $password = ConvertTo-SecureString -String $env:WINDOWS_CERTIFICATE_PASSWORD -Force -AsPlainText
          $certificate = Import-PfxCertificate -FilePath $certificatePath -CertStoreLocation Cert:\CurrentUser\My -Password $password
          if (-not $certificate.HasPrivateKey) { throw 'Imported certificate has no private key' }
          "RESTORK_WINDOWS_CERTIFICATE_THUMBPRINT=$($certificate.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Remove-Item -Force $certificatePath
      - name: Build Authenticode and updater-signed installers
        shell: pwsh
        env:
          RESTORK_WINDOWS_TIMESTAMP_URL: ${{ secrets.WINDOWS_TIMESTAMP_URL }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        run: |
          $ErrorActionPreference = 'Stop'
          uv run python scripts/desktop_release.py config --platform windows --output build/desktop-release-config.json
          npm --prefix desktop exec tauri build -- --config ../build/desktop-release-config.json
      - name: Verify downloaded-file Authenticode policy
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $paths = @(
            Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*.exe,
            Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi
          )
          if ($paths.Count -lt 2) { throw 'Expected NSIS and MSI installers' }
          foreach ($path in $paths) {
            $signature = Get-AuthenticodeSignature $path.FullName
            if ($signature.Status -ne 'Valid') { throw "Invalid Authenticode signature: $($path.Name) / $($signature.Status)" }
          }
      - name: Stage Windows release assets
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force dist/desktop-windows | Out-Null
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe dist/desktop-windows/
          Copy-Item desktop/src-tauri/target/release/bundle/nsis/*.exe.sig dist/desktop-windows/
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi dist/desktop-windows/
          Copy-Item desktop/src-tauri/target/release/bundle/msi/*.msi.sig dist/desktop-windows/
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/desktop-windows/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-windows-signed
          path: dist/desktop-windows/
          if-no-files-found: error
          retention-days: 30

  desktop-linux:
    needs: validate-release-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-linux
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux desktop dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - name: Require protected Linux and updater credentials
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        run: |
          set -euo pipefail
          for variable in LINUX_GPG_PRIVATE_KEY LINUX_GPG_PASSPHRASE LINUX_GPG_KEY_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD RESTORK_UPDATER_PUBLIC_KEY RESTORK_UPDATER_ENDPOINT; do
            test -n "${!variable:-}" || { echo "Missing protected release credential: $variable" >&2; exit 1; }
          done
      - name: Import Linux package signing key
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --list-secret-keys "$LINUX_GPG_KEY_ID"
      - name: Build embedded-GPG and updater-signed Linux packages
        shell: bash
        env:
          SIGN: "1"
          SIGN_KEY: ${{ secrets.LINUX_GPG_KEY_ID }}
          APPIMAGETOOL_SIGN_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          APPIMAGETOOL_FORCE_SIGN: "1"
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        run: |
          set -euo pipefail
          uv run python scripts/desktop_release.py config --platform linux --output build/desktop-release-config.json
          npm --prefix desktop exec tauri build -- --config ../build/desktop-release-config.json
          appimage="$(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          "$appimage" --appimage-signature | grep -E '.+'
      - name: Add and verify detached package signatures
        shell: bash
        env:
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          mkdir -p dist/desktop-linux
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage dist/desktop-linux/
          cp desktop/src-tauri/target/release/bundle/appimage/*.AppImage.sig dist/desktop-linux/
          cp desktop/src-tauri/target/release/bundle/deb/*.deb dist/desktop-linux/
          for artifact in dist/desktop-linux/*.AppImage dist/desktop-linux/*.deb; do
            gpg --batch --yes --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" --local-user "$LINUX_GPG_KEY_ID" --armor --detach-sign "$artifact"
            gpg --batch --verify "$artifact.asc" "$artifact"
          done
          gpg --batch --armor --export "$LINUX_GPG_KEY_ID" > dist/desktop-linux/restork-release-public-key.asc
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/desktop-linux/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-linux-signed
          path: dist/desktop-linux/
          if-no-files-found: error
          retention-days: 30

  clean-machine-macos:
    needs: desktop-macos
    runs-on: macos-15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-desktop-macos-signed
          path: candidate
      - name: Verify the downloaded DMG on a fresh runner
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find candidate -name '*.dmg' -print -quit)"
          mount="$(mktemp -d)"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/Restork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          spctl --assess --type execute --verbose=2 "$app"
          xcrun stapler validate "$app"
          ./scripts/smoke-desktop-app.sh 3 "$app"
          hdiutil detach "$mount"
          trap - EXIT
          rmdir "$mount"

  clean-machine-windows:
    needs: desktop-windows
    runs-on: windows-2025
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-desktop-windows-signed
          path: candidate
      - name: Verify, silently install, launch, and preserve user data on uninstall
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Get-ChildItem candidate/*-setup.exe | Select-Object -First 1
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') { throw 'Downloaded installer signature is invalid' }
          Start-Process $installer.FullName -ArgumentList '/S' -Wait
          $application = Join-Path $env:LOCALAPPDATA 'Restork\Restork.exe'
          $uninstaller = Join-Path $env:LOCALAPPDATA 'Restork\uninstall.exe'
          if (-not (Test-Path $application) -or -not (Test-Path $uninstaller)) { throw 'Restork was not installed in the per-user location' }
          $process = Start-Process $application -PassThru
          $diagnostics = Join-Path $env:LOCALAPPDATA 'io.github.totoro-qaq.restork\logs\desktop-events.jsonl'
          $ready = $false
          for ($attempt = 0; $attempt -lt 120; $attempt++) {
            if ($process.HasExited) { throw 'Restork exited during clean-machine launch' }
            if ((Test-Path $diagnostics) -and (Select-String -Path $diagnostics -SimpleMatch '"event":"browser_session_stored"' -Quiet)) {
              $ready = $true
              break
            }
            Start-Sleep -Milliseconds 250
          }
          if (-not $ready) { throw 'Restork did not complete Core readiness and browser pairing' }
          Stop-Process -Id $process.Id -Force
          Start-Sleep -Seconds 2
          if (Get-Process restorkd -ErrorAction SilentlyContinue) { throw 'Restork Core survived its desktop owner' }
          $data = Join-Path $env:APPDATA 'io.github.totoro-qaq.restork'
          New-Item -ItemType Directory -Force $data | Out-Null
          Set-Content -Path (Join-Path $data 'clean-machine-sentinel') -Value 'preserve'
          Start-Process $uninstaller -ArgumentList '/S' -Wait
          if (-not (Test-Path (Join-Path $data 'clean-machine-sentinel'))) { throw 'Uninstall removed user data without a preservation choice' }

  clean-machine-linux:
    needs: desktop-linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-desktop-linux-signed
          path: candidate
      - name: Verify, install, launch, and preserve user data on uninstall
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y xvfb dbus-x11 libwebkit2gtk-4.1-0
          gpg --batch --import candidate/restork-release-public-key.asc
          appimage="$(find candidate -name '*.AppImage' -print -quit)"
          deb="$(find candidate -name '*.deb' -print -quit)"
          gpg --batch --verify "$appimage.asc" "$appimage"
          gpg --batch --verify "$deb.asc" "$deb"
          sudo apt-get install -y "$PWD/$deb"
          dbus-run-session -- xvfb-run -a restork &
          pid=$!
          diagnostics="$HOME/.local/share/io.github.totoro-qaq.restork/logs/desktop-events.jsonl"
          ready=0
          for _attempt in $(seq 1 120); do
            kill -0 "$pid"
            if test -f "$diagnostics" && grep -q '"event":"browser_session_stored"' "$diagnostics"; then
              ready=1
              break
            fi
            sleep 0.25
          done
          test "$ready" = 1
          kill "$pid"
          wait "$pid" || true
          sleep 2
          ! pgrep -x restorkd
          data="$HOME/.local/share/io.github.totoro-qaq.restork"
          mkdir -p "$data"
          printf '%s\n' preserve > "$data/clean-machine-sentinel"
          sudo apt-get remove -y restork
          test -f "$data/clean-machine-sentinel"

  assemble-desktop-release:
    needs:
      - desktop-macos
      - desktop-windows
      - desktop-linux
      - clean-machine-macos
      - clean-machine-windows
      - clean-machine-linux
    runs-on: ubuntu-latest
    environment: release-linux
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: restork-desktop-*-signed
          path: dist/desktop-release
          merge-multiple: true
      - name: Create one target-scoped updater manifest, SBOM, and artifact ledger
        shell: bash
        run: |
          set -euo pipefail
          uv run python scripts/generate_sbom.py --root . --output dist/desktop-release/restork.cdx.json
          uv run python scripts/desktop_release.py manifest --directory dist/desktop-release --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --version "${GITHUB_REF_NAME#v}" --commit "$GITHUB_SHA" --channel alpha
      - name: Sign and verify aggregate checksums
        shell: bash
        env:
          LINUX_GPG_PRIVATE_KEY: ${{ secrets.LINUX_GPG_PRIVATE_KEY }}
          LINUX_GPG_PASSPHRASE: ${{ secrets.LINUX_GPG_PASSPHRASE }}
          LINUX_GPG_KEY_ID: ${{ secrets.LINUX_GPG_KEY_ID }}
        run: |
          set -euo pipefail
          test -n "$LINUX_GPG_PRIVATE_KEY" && test -n "$LINUX_GPG_PASSPHRASE" && test -n "$LINUX_GPG_KEY_ID"
          printf '%s' "$LINUX_GPG_PRIVATE_KEY" | base64 --decode | gpg --batch --import
          gpg --batch --yes --pinentry-mode loopback --passphrase "$LINUX_GPG_PASSPHRASE" --local-user "$LINUX_GPG_KEY_ID" --armor --detach-sign dist/desktop-release/SHA256SUMS
          gpg --batch --verify dist/desktop-release/SHA256SUMS.asc dist/desktop-release/SHA256SUMS
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/desktop-release/latest.json
            dist/desktop-release/release-manifest.json
            dist/desktop-release/SHA256SUMS
            dist/desktop-release/restork.cdx.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-release
          path: dist/desktop-release/
          if-no-files-found: error
          retention-days: 30

  publish-github-release:
    needs: [source-release, assemble-desktop-release]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: restork-*-release
          path: dist/publish
          merge-multiple: true
      - name: Publish immutable verified assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/publish/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --generate-notes
          --title "Restork $GITHUB_REF_NAME"
