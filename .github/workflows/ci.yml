name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p restorkd

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: cargo test --manifest-path rust/Cargo.toml --locked --workspace
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p restorkd

  dependency-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: cargo install cargo-audit --locked
      - run: cargo install cargo-deny --locked
      - run: cargo audit --file rust/Cargo.lock
      - run: cargo deny --config deny.toml --manifest-path rust/Cargo.toml check advisories bans sources

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run fmt:check
      - run: node scripts/build-desktop-runtime.mjs
      - run: npm --prefix desktop run clippy
      - run: npm --prefix desktop test
      - run: ./scripts/smoke-desktop-runtime.sh
      - run: npm --prefix desktop run build:app
      - name: Ad-hoc sign internal test bundle
        run: >-
          codesign --force --deep --sign - --timestamp=none
          --entitlements desktop/src-tauri/Entitlements.plist
          desktop/src-tauri/target/release/bundle/macos/Restork.app
      - run: codesign --verify --deep --strict --verbose=2 desktop/src-tauri/target/release/bundle/macos/Restork.app
      - name: Verify aggregate unread-mail entitlement
        run: >-
          codesign --display --entitlements :-
          desktop/src-tauri/target/release/bundle/macos/Restork.app 2>&1
          | grep -q com.apple.security.automation.apple-events

  desktop-windows-linux:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            config: src-tauri/tauri.linux.conf.json
            artifact_path: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-2025
            platform: windows-x64
            config: src-tauri/tauri.windows.conf.json
            artifact_path: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run fmt:check
      - run: node scripts/build-desktop-runtime.mjs
      - run: node scripts/smoke-desktop-runtime.mjs
      - run: npm --prefix desktop run clippy
      - run: npm --prefix desktop test
      - run: npm exec tauri build -- --config ${{ matrix.config }}
        working-directory: desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-${{ matrix.platform }}-unsigned-candidate
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  public-artifact-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/scan-public-artifacts.sh

  release-blocking-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - name: SEC-NET-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-provider
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test loopback_boundary
      - name: SEC-APPROVAL-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-deliverables --test approval_contract
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-core --test durable_loop_contract
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test deliverables_api_contract
      - name: SEC-AUTH-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-core --test auth
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test auth_contract
      - name: SEC-SQL-001
        run: cargo test --manifest-path rust/Cargo.toml --locked -p restork-storage --tests
      - name: SEC-PROMPT-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-personal --test domain_contracts
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-provider
      - name: CONV-BOUNDARY-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test workspace_api_contract
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test operation_sse_contract
      - name: PRIV-LABEL-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-personal
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test automation_api_contract
      - name: REC-EFFECT-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-core --test durable_loop_contract
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-storage --test operation_contract
      - name: REL-WRITE-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-core workspace
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test bootstrap_api_contract
      - name: REL-EVENT-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-storage --test storage_contract
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test sse_replay_contract
      - name: OSS-CLEAN-001
        run: ./scripts/scan-public-artifacts.sh
      - name: MEM-RETENTION-001
        run: cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test feature_api_contract
      - name: UI-CONTEXT-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-api --test daily_api_contract
          && npm --prefix dashboard test
      - name: DESKTOP-BOUNDARY-001
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restorkd
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-worker
      - name: README-ASSET-001
        run: python3 scripts/audit_readme.py README.md README.zh-CN.md
      - name: Golden modes and rendering parity
        run: >-
          cargo test --manifest-path rust/Cargo.toml --locked -p restork-core
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-deliverables
          && cargo test --manifest-path rust/Cargo.toml --locked -p restork-render
