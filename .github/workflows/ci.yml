name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify:
    name: Classify changes
    runs-on: ubuntu-latest
    outputs:
      rust: ${{ steps.paths.outputs.rust }}
      dashboard: ${{ steps.paths.outputs.dashboard }}
      desktop: ${{ steps.paths.outputs.desktop }}
      dependency: ${{ steps.paths.outputs.dependency }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: paths
        name: Route the affected test lanes
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BEFORE_SHA: ${{ github.event.before }}
          CURRENT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          case "$EVENT_NAME" in
            pull_request)
              git diff --name-only -z "$PR_BASE_SHA" "$PR_HEAD_SHA" \
                | python3 scripts/ci/classify_changes.py \
                | tee -a "$GITHUB_OUTPUT"
              ;;
            push)
              if [[ -z "$BEFORE_SHA" || "$BEFORE_SHA" =~ ^0+$ ]]; then
                python3 scripts/ci/classify_changes.py --all \
                  | tee -a "$GITHUB_OUTPUT"
              else
                git diff --name-only -z "$BEFORE_SHA" "$CURRENT_SHA" \
                  | python3 scripts/ci/classify_changes.py \
                  | tee -a "$GITHUB_OUTPUT"
              fi
              ;;
            *)
              python3 scripts/ci/classify_changes.py --all \
                | tee -a "$GITHUB_OUTPUT"
              ;;
          esac

  script-contracts:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - run: node --test scripts/tests/windows-toolchain.test.mjs
      - run: python3 -m unittest scripts.tests.test_desktop_release
      - run: python3 -m unittest scripts.tests.test_ci_routing
      - run: python3 -m unittest scripts.tests.test_spacing_grid
      - run: python3 -m unittest scripts.tests.test_sync_site_downloads
      - run: python3 -m unittest scripts.tests.test_windows_desktop_lifecycle
      - run: python3 scripts/check_architecture.py
      - run: python3 scripts/check_spacing_grid.py
      - run: python3 scripts/check_intent_limits.py
      - run: python3 scripts/check_voice.py

  rust-core:
    needs: classify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.classify.outputs.rust == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: restork-rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - name: Build crate documentation without warnings
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --manifest-path rust/Cargo.toml --locked --workspace --no-deps
      - name: Build the release Core
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
        run: cargo build --manifest-path rust/Cargo.toml --release --locked -p restorkd

  rust-platforms:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
          key: restork-rust-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock') }}
      - run: cargo test --manifest-path rust/Cargo.toml --locked --workspace
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p restorkd

  dependency-policy:
    needs: classify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.classify.outputs.dependency == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: restork-policy-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'deny.toml') }}
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/bin/cargo-audit
            ~/.cargo/bin/cargo-deny
          key: restork-policy-tools-${{ runner.os }}-audit-0.22.2-deny-0.20.2
      - run: command -v cargo-audit >/dev/null || cargo install cargo-audit --version 0.22.2 --locked
      - run: command -v cargo-deny >/dev/null || cargo install cargo-deny --version 0.20.2 --locked
      - run: cargo audit --file rust/Cargo.lock
      - run: cargo deny --config deny.toml --manifest-path rust/Cargo.toml check advisories bans sources

  dashboard:
    needs: classify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.classify.outputs.dashboard == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build

  desktop-check:
    name: desktop-check (${{ matrix.platform }})
    needs: classify
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci')) || needs.classify.outputs.desktop == 'true'
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON((github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))) && '[{"os":"macos-15","platform":"macos"},{"os":"windows-2025","platform":"windows-msvc"},{"os":"ubuntu-latest","platform":"linux"}]' || '[{"os":"ubuntu-latest","platform":"linux"}]') }}
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
      - name: Install Linux desktop check dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - name: Require the Windows MSVC Rust toolchain
        if: runner.os == 'Windows'
        run: node scripts/windows-toolchain.mjs
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            desktop/src-tauri/target
          key: restork-desktop-${{ runner.os }}-${{ hashFiles('desktop/src-tauri/Cargo.lock') }}
      - name: Prepare the compile-only desktop resource directory
        run: >-
          node -e "require('node:fs').mkdirSync('dist/desktop-runtime',
          { recursive: true })"
      - run: cargo fmt --manifest-path desktop/src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path desktop/src-tauri/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path desktop/src-tauri/Cargo.toml --locked

  desktop-macos:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            desktop/src-tauri/target
          key: restork-package-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run build:app
      - run: ./scripts/smoke-desktop-runtime.sh
      - name: Ad-hoc sign internal test bundle
        run: >-
          codesign --force --deep --sign - --timestamp=none
          --entitlements desktop/src-tauri/Entitlements.plist
          desktop/src-tauri/target/release/bundle/macos/Restork.app
      - run: codesign --verify --deep --strict --verbose=2 desktop/src-tauri/target/release/bundle/macos/Restork.app
      - name: Verify aggregate unread-mail entitlement
        run: >-
          codesign --display --entitlements :-
          desktop/src-tauri/target/release/bundle/macos/Restork.app 2>&1
          | grep -q com.apple.security.automation.apple-events

  desktop-windows-linux:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            config: src-tauri/tauri.linux.conf.json
            artifact_path: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-2025
            platform: windows-x64
            config: src-tauri/tauri.windows.conf.json
            artifact_path: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - name: Require the Windows MSVC Rust toolchain
        if: runner.os == 'Windows'
        run: node scripts/windows-toolchain.mjs
      - uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust/target
            desktop/src-tauri/target
          key: restork-package-${{ runner.os }}-${{ hashFiles('rust/Cargo.lock', 'desktop/src-tauri/Cargo.lock') }}
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: npm exec tauri build -- --config ${{ matrix.config }}
        working-directory: desktop
      - run: node scripts/smoke-desktop-runtime.mjs
      - name: Exercise Windows installers on the clean runner
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          $msi = Get-ChildItem desktop/src-tauri/target/release/bundle/msi/*.msi | Select-Object -First 1
          if ($null -eq $nsis -or $null -eq $msi) { throw 'Expected both NSIS and MSI installers' }
          ./scripts/smoke-desktop-windows.ps1 `
            -NsisInstaller $nsis.FullName `
            -MsiInstaller $msi.FullName `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'restork-windows-e2e')
      - name: Upload Windows clean-machine diagnostics
        if: ${{ runner.os == 'Windows' && !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-windows-clean-machine-diagnostics
          path: ${{ runner.temp }}/restork-windows-e2e/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-${{ matrix.platform }}-unsigned-candidate
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  public-artifact-scan:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/scan-public-artifacts.sh
      - run: python3 scripts/audit_readme.py README.md README.zh-CN.md

  pr-gate:
    name: PR gate
    if: always()
    needs:
      - classify
      - script-contracts
      - rust-core
      - dependency-policy
      - dashboard
      - desktop-check
      - public-artifact-scan
      - release-blocking-gates
    runs-on: ubuntu-latest
    steps:
      - name: Confirm every affected lane passed
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          FULL_CI: ${{ contains(github.event.pull_request.labels.*.name, 'full-ci') }}
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SCRIPT_RESULT: ${{ needs.script-contracts.result }}
          PUBLIC_RESULT: ${{ needs.public-artifact-scan.result }}
          RUST_REQUIRED: ${{ needs.classify.outputs.rust }}
          RUST_RESULT: ${{ needs.rust-core.result }}
          DASHBOARD_REQUIRED: ${{ needs.classify.outputs.dashboard }}
          DASHBOARD_RESULT: ${{ needs.dashboard.result }}
          DESKTOP_REQUIRED: ${{ needs.classify.outputs.desktop }}
          DESKTOP_RESULT: ${{ needs.desktop-check.result }}
          DEPENDENCY_REQUIRED: ${{ needs.classify.outputs.dependency }}
          DEPENDENCY_RESULT: ${{ needs.dependency-policy.result }}
          FULL_GRAPH_RESULT: ${{ needs.release-blocking-gates.result }}
        run: |
          set -euo pipefail

          require_success() {
            local lane="$1"
            local result="$2"
            if [[ "$result" != "success" ]]; then
              echo "::error::$lane finished with '$result', expected 'success'."
              return 1
            fi
          }

          require_affected_lane() {
            local lane="$1"
            local required="$2"
            local result="$3"
            if [[ "$EVENT_NAME" == "workflow_dispatch" || ("$EVENT_NAME" == "pull_request" && "$FULL_CI" == "true") || "$required" == "true" ]]; then
              require_success "$lane" "$result"
            elif [[ "$result" != "skipped" ]]; then
              echo "::error::$lane was not affected but finished with '$result', expected 'skipped'."
              return 1
            fi
          }

          require_success "change classifier" "$CLASSIFY_RESULT"
          require_success "script contracts" "$SCRIPT_RESULT"
          require_success "public artifact scan" "$PUBLIC_RESULT"
          require_affected_lane "Rust" "$RUST_REQUIRED" "$RUST_RESULT"
          require_affected_lane "Dashboard" "$DASHBOARD_REQUIRED" "$DASHBOARD_RESULT"
          require_affected_lane "Desktop" "$DESKTOP_REQUIRED" "$DESKTOP_RESULT"
          require_affected_lane "dependency policy" "$DEPENDENCY_REQUIRED" "$DEPENDENCY_RESULT"
          require_affected_lane "full release graph" "false" "$FULL_GRAPH_RESULT"

          echo "Every affected PR lane passed. Unaffected heavyweight lanes were skipped."

  fast-gates:
    name: Fast PR gates
    if: always()
    needs: pr-gate
    runs-on: ubuntu-latest
    steps:
      - name: Preserve the current branch-protection context during migration
        env:
          PR_GATE_RESULT: ${{ needs.pr-gate.result }}
        run: test "$PR_GATE_RESULT" = "success"

  release-blocking-gates:
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'full-ci'))
    needs:
      - script-contracts
      - rust-core
      - rust-platforms
      - dependency-policy
      - dashboard
      - desktop-check
      - desktop-macos
      - desktop-windows-linux
      - public-artifact-scan
    runs-on: ubuntu-latest
    steps:
      - name: Confirm the full gate graph completed once
        run: echo "Rust, Dashboard, policy, public scan, three-platform tests, packages, and clean-machine checks passed."
