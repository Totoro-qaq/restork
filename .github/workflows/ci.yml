name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  rust-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: cargo fmt --manifest-path rust/Cargo.toml --all -- --check
      - run: cargo clippy --manifest-path rust/Cargo.toml --locked --all-targets -- -D warnings
      - run: cargo test --manifest-path rust/Cargo.toml --locked
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p restorkd

  rust-platforms:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, ubuntu-latest, windows-2025]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: cargo test --manifest-path rust/Cargo.toml --locked -p restorkd
      - run: cargo build --manifest-path rust/Cargo.toml --release --locked -p restorkd

  # Deprecated Python Core. Retained only because all 14 release-blocking gates
  # below still execute pytest and have no Rust counterpart yet; Stage 6C ports
  # them and this job is deleted with `src/restork/`.
  legacy-python-core:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run mypy src
      - run: uv run bandit -q -r src
      - run: uv run restork --help

  dashboard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: dashboard/package-lock.json
      - run: npm --prefix dashboard ci
      - run: npm --prefix dashboard run lint
      - run: npm --prefix dashboard test
      - run: npm --prefix dashboard run build
      - run: uv build --no-sources

  desktop-macos:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run fmt:check
      - run: node scripts/build-desktop-runtime.mjs
      - run: npm --prefix desktop run clippy
      - run: npm --prefix desktop test
      - run: ./scripts/smoke-desktop-runtime.sh
      - run: npm --prefix desktop run build:app
      - name: Ad-hoc sign internal test bundle
        run: >-
          codesign --force --deep --sign - --timestamp=none
          --entitlements desktop/src-tauri/Entitlements.plist
          desktop/src-tauri/target/release/bundle/macos/Restork.app
      - run: codesign --verify --deep --strict --verbose=2 desktop/src-tauri/target/release/bundle/macos/Restork.app
      - name: Verify aggregate unread-mail entitlement
        run: >-
          codesign --display --entitlements :-
          desktop/src-tauri/target/release/bundle/macos/Restork.app 2>&1
          | grep -q com.apple.security.automation.apple-events

  desktop-windows-linux:
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
            config: src-tauri/tauri.linux.conf.json
            artifact_path: |
              desktop/src-tauri/target/release/bundle/appimage/*.AppImage
              desktop/src-tauri/target/release/bundle/deb/*.deb
          - os: windows-2025
            platform: windows-x64
            config: src-tauri/tauri.windows.conf.json
            artifact_path: |
              desktop/src-tauri/target/release/bundle/nsis/*.exe
              desktop/src-tauri/target/release/bundle/msi/*.msi
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux desktop build dependencies
        if: runner.os == 'Linux'
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal --component rustfmt,clippy
      - run: rustup default 1.97.1
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: npm --prefix desktop run fmt:check
      - run: node scripts/build-desktop-runtime.mjs
      - run: node scripts/smoke-desktop-runtime.mjs
      - run: npm --prefix desktop run clippy
      - run: npm --prefix desktop test
      - run: npm exec tauri build -- --config ${{ matrix.config }}
        working-directory: desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-desktop-${{ matrix.platform }}-unsigned-candidate
          path: ${{ matrix.artifact_path }}
          if-no-files-found: error
          retention-days: 7

  public-artifact-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - run: ./scripts/scan-public-artifacts.sh

  release-blocking-gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen --all-groups
      - name: SEC-NET-001
        run: >-
          uv run pytest tests/network
          tests/e2e/test_release_gates.py::test_sec_net_001_core_network_clients_stay_behind_declared_boundaries
      - name: SEC-APPROVAL-001
        run: >-
          uv run pytest tests/storage/test_approvals.py
          tests/recovery/test_writes.py::test_sec_approval_001_symlink_swap_cannot_escape_approved_note
      - name: SEC-AUTH-001
        run: >-
          uv run pytest tests/api/test_auth.py tests/api/test_app.py tests/api/test_provider.py
          tests/e2e/test_release_gates.py::test_sec_auth_001_every_non_pairing_api_route_has_a_scoped_token_dependency
      - name: SEC-SQL-001
        run: >-
          uv run pytest
          tests/security/test_prompt_and_sql_gates.py::test_sec_sql_001_sqlite_calls_cannot_build_queries_from_dynamic_expressions
      - name: SEC-PROMPT-001
        run: >-
          uv run pytest
          tests/security/test_prompt_and_sql_gates.py
          tests/conversation/test_conversation_service.py::test_run_conversation_is_idempotent_toolless_and_prompt_versioned
      - name: CONV-BOUNDARY-001
        run: uv run pytest tests/conversation tests/api/test_conversation.py
      - name: PRIV-LABEL-001
        run: uv run pytest tests/privacy
      - name: REC-EFFECT-001
        run: >-
          uv run pytest tests/recovery/test_effects.py
          tests/runtime/test_agent_loop.py::test_rec_effect_001_never_repeats_started_or_committed_non_pure_effects
      - name: REL-WRITE-001
        run: uv run pytest tests/knowledge/test_write_journal.py tests/recovery/test_writes.py
      - name: REL-EVENT-001
        run: >-
          uv run pytest tests/recovery/test_event_recovery.py tests/storage/test_events.py
          tests/storage/test_replay.py tests/storage/test_runs.py tests/storage/test_intents.py
      - name: OSS-CLEAN-001
        run: uv run pytest tests/test_public_artifact_scan.py && ./scripts/scan-public-artifacts.sh
      - name: MEM-RETENTION-001
        run: uv run pytest tests/memory tests/api/test_memory.py
      - name: UI-CONTEXT-001
        run: uv run pytest tests/daily tests/api/test_daily.py
      - name: DESKTOP-BOUNDARY-001
        run: uv run pytest tests/desktop
      - name: README-ASSET-001
        run: uv run python scripts/audit_readme.py README.md README.zh-CN.md
      - name: Golden modes, rendering parity, and aggregate metrics
        run: >-
          uv run pytest tests/evals tests/rendering
          && uv run python scripts/evaluate_release.py
          tests/evals/release_observations.json --output build/release-metrics.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: aggregate-release-metrics
          path: build/release-metrics.json
          if-no-files-found: error
          retention-days: 14
