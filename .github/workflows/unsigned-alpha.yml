name: Public desktop technical preview

on:
  push:
    tags: ["v*-alpha.*"]

concurrency:
  group: public-desktop-alpha-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-alpha-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require an annotated Alpha tag on a commit reachable from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-macos-alpha:
    needs: validate-alpha-ref
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-macos
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: python3 scripts/desktop_release.py --help
      - run: ./scripts/scan-public-artifacts.sh
      - name: Require only updater credentials and an Apple Silicon runner
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          for variable in TAURI_SIGNING_PRIVATE_KEY RESTORK_UPDATER_PUBLIC_KEY RESTORK_UPDATER_ENDPOINT; do
            test -n "${!variable:-}" || { echo "Missing updater credential: $variable" >&2; exit 1; }
          done
      - name: Build ad-hoc-signed app, DMG, and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/desktop_release.py config --platform macos --version "$version" --signing-mode ad-hoc --output build/desktop-alpha-config.json
          npm --prefix desktop exec tauri build -- --config build/desktop-alpha-config.json
      - name: Verify the signature is ad hoc and never claim Developer ID trust
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Restork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/restork-codesign.txt"
          grep -q "^Signature=adhoc$" "$RUNNER_TEMP/restork-codesign.txt"
          ! grep -q "^Authority=Developer ID Application:" "$RUNNER_TEMP/restork-codesign.txt"
          codesign --display --entitlements :- "$app" 2>&1 | grep -q com.apple.security.automation.apple-events
      - name: Stage visibly labeled macOS Alpha assets
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-alpha
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          archive="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -f "$dmg" && test -f "$archive" && test -f "$archive.sig"
          cp "$dmg" "dist/macos-alpha/Restork-${version}-macOS-arm64-UNSIGNED-ALPHA.dmg"
          cp "$archive" "dist/macos-alpha/Restork-${version}-macOS-arm64.app.tar.gz"
          cp "$archive.sig" "dist/macos-alpha/Restork-${version}-macOS-arm64.app.tar.gz.sig"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/macos-alpha/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-public-macos-alpha
          path: dist/macos-alpha/
          if-no-files-found: error
          retention-days: 30

  build-windows-alpha:
    needs: validate-alpha-ref
    runs-on: windows-2025
    timeout-minutes: 60
    environment: release-windows
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1-x86_64-pc-windows-msvc --profile minimal
      - run: rustup default 1.97.1-x86_64-pc-windows-msvc
      - name: Reject GNU and MinGW before dependency installation
        run: node scripts/windows-toolchain.mjs
      - run: node --test scripts/tests/windows-toolchain.test.mjs
      - run: python -m unittest scripts.tests.test_windows_desktop_lifecycle
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - name: Build unsigned Windows EXE with no updater claim
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          python scripts/desktop_release.py config --platform windows --version $version --signing-mode unsigned --output build/desktop-alpha-config.json
          npm --prefix desktop exec tauri build -- --config build/desktop-alpha-config.json
      - name: Stage visibly labeled Windows technical-preview installers
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $version = $env:GITHUB_REF_NAME.Substring(1)
          New-Item -ItemType Directory -Force dist/windows-alpha | Out-Null
          $nsis = Get-ChildItem desktop/src-tauri/target/release/bundle/nsis/*-setup.exe | Select-Object -First 1
          if ($null -eq $nsis) { throw 'Expected an NSIS installer' }
          Copy-Item $nsis.FullName "dist/windows-alpha/Restork-$version-Windows-x64-UNSIGNED-ALPHA-setup.exe"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/windows-alpha/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-public-windows-alpha
          path: dist/windows-alpha/
          if-no-files-found: error
          retention-days: 30

  build-linux-alpha:
    needs: validate-alpha-ref
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-linux
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install Linux packaging dependencies
        run: >-
          sudo apt-get update && sudo apt-get install -y
          libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libfuse2
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - name: Build unsigned Linux AppImage and DEB with no updater claim
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/desktop_release.py config --platform linux --version "$version" --signing-mode unsigned --output build/desktop-alpha-config.json
          npm --prefix desktop exec tauri build -- --config build/desktop-alpha-config.json
      - name: Stage visibly labeled Linux technical-preview packages
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/linux-alpha
          appimage="$(find desktop/src-tauri/target/release/bundle/appimage -maxdepth 1 -name '*.AppImage' -print -quit)"
          deb="$(find desktop/src-tauri/target/release/bundle/deb -maxdepth 1 -name '*.deb' -print -quit)"
          test -f "$appimage" && test -f "$deb"
          cp "$appimage" "dist/linux-alpha/Restork-${version}-Linux-x64-UNSIGNED-ALPHA.AppImage"
          cp "$deb" "dist/linux-alpha/Restork-${version}-Linux-x64-UNSIGNED-ALPHA.deb"
          chmod +x "dist/linux-alpha/Restork-${version}-Linux-x64-UNSIGNED-ALPHA.AppImage"
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/linux-alpha/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-public-linux-alpha
          path: dist/linux-alpha/
          if-no-files-found: error
          retention-days: 30

  clean-machine-macos:
    needs: build-macos-alpha
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-public-macos-alpha
          path: candidate
      - name: Mount, verify ad-hoc identity, launch three times, and cleanly stop Core
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find candidate -name '*-UNSIGNED-ALPHA.dmg' -print -quit)"
          mount="$(mktemp -d)"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/Restork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -q "^Signature=adhoc$"
          codesign --display --entitlements :- "$app" 2>&1 | grep -q com.apple.security.automation.apple-events
          ./scripts/smoke-desktop-app.sh 3 "$app"
          hdiutil detach "$mount"
          trap - EXIT
          rmdir "$mount"

  clean-machine-windows:
    needs: build-windows-alpha
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-public-windows-alpha
          path: candidate
      - name: Install, launch, own Core, uninstall, and preserve user data
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $nsis = Get-ChildItem candidate/*-setup.exe | Select-Object -First 1
          if ($null -eq $nsis) { throw 'Expected a Windows NSIS installer' }
          ./scripts/smoke-desktop-windows.ps1 `
            -NsisInstaller $nsis.FullName `
            -ArtifactDirectory (Join-Path $env:RUNNER_TEMP 'restork-windows-alpha-e2e')
      - name: Upload Windows lifecycle diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-public-windows-alpha-diagnostics
          path: ${{ runner.temp }}/restork-windows-alpha-e2e/
          if-no-files-found: error
          retention-days: 14

  clean-machine-linux:
    needs: build-linux-alpha
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-public-linux-alpha
          path: candidate
      - name: Install Linux runtime dependencies only
        run: >-
          sudo apt-get update && sudo apt-get install -y
          xvfb dbus-x11 libwebkit2gtk-4.1-0 libfuse2
      - name: Exercise AppImage and DEB without a compiler toolchain
        shell: bash
        run: |
          set -euo pipefail
          appimage="$(find candidate -name '*.AppImage' -print -quit)"
          deb="$(find candidate -name '*.deb' -print -quit)"
          test -f "$appimage" && test -f "$deb"
          ./scripts/smoke-desktop-linux.sh "$appimage" "$deb"

  assemble-alpha:
    needs:
      - build-macos-alpha
      - build-windows-alpha
      - build-linux-alpha
      - clean-machine-macos
      - clean-machine-windows
      - clean-machine-linux
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: restork-public-*-alpha
          path: dist/public-alpha
          merge-multiple: true
      - name: Create one cross-platform ledger, updater manifest, SBOM, and checksums
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          python3 scripts/generate_sbom.py --root . --output dist/public-alpha/restork.cdx.json
          python3 scripts/desktop_release.py manifest --directory dist/public-alpha --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --version "$version" --commit "$GITHUB_SHA" --channel alpha --trust technical-preview
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: |
            dist/public-alpha/SHA256SUMS
            dist/public-alpha/release-manifest.json
            dist/public-alpha/restork.cdx.json
            dist/public-alpha/alpha.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-public-desktop-alpha
          path: dist/public-alpha/
          if-no-files-found: error
          retention-days: 30

  publish-alpha:
    needs: assemble-alpha
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-public-desktop-alpha
          path: dist/publish
      - name: Publish a clearly labeled desktop Alpha
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/publish/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --prerelease
          --title "Restork $GITHUB_REF_NAME — Desktop Technical Preview"
          --notes-file docs/unsigned-alpha-release.md
