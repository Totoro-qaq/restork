name: Public unsigned macOS Alpha

on:
  push:
    tags: ["v*-alpha.*"]

concurrency:
  group: public-macos-alpha-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate-alpha-ref:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Require an annotated Alpha tag on a commit reachable from main
        shell: bash
        run: |
          set -euo pipefail
          [[ "$GITHUB_REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+-alpha\.[0-9]+$ ]]
          test "$(git cat-file -t "$GITHUB_REF_NAME")" = tag
          test "$(git rev-list -n 1 "$GITHUB_REF_NAME")" = "$GITHUB_SHA"
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main

  build-macos-alpha:
    needs: validate-alpha-ref
    runs-on: macos-15
    timeout-minutes: 60
    environment: release-macos
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          python-version: "3.12"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            dashboard/package-lock.json
            desktop/package-lock.json
      - run: rustup toolchain install 1.97.1 --profile minimal
      - run: rustup default 1.97.1
      - run: uv sync --frozen --all-groups
      - run: npm --prefix dashboard ci
      - run: npm --prefix desktop ci
      - run: uv run pytest tests/desktop/test_desktop_release.py
      - run: ./scripts/scan-public-artifacts.sh
      - name: Require only updater credentials and an Apple Silicon runner
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          test "$(uname -m)" = arm64
          for variable in TAURI_SIGNING_PRIVATE_KEY RESTORK_UPDATER_PUBLIC_KEY RESTORK_UPDATER_ENDPOINT; do
            test -n "${!variable:-}" || { echo "Missing updater credential: $variable" >&2; exit 1; }
          done
      - name: Build ad-hoc-signed app, DMG, and updater archive
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          RESTORK_UPDATER_PUBLIC_KEY: ${{ secrets.RESTORK_UPDATER_PUBLIC_KEY }}
          RESTORK_UPDATER_ENDPOINT: ${{ secrets.RESTORK_UPDATER_ENDPOINT }}
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          uv run python scripts/desktop_release.py config --platform macos --version "$version" --signing-mode ad-hoc --output build/desktop-alpha-config.json
          npm --prefix desktop exec tauri build -- --config build/desktop-alpha-config.json
      - name: Verify the signature is ad hoc and never claim Developer ID trust
        shell: bash
        run: |
          set -euo pipefail
          app="desktop/src-tauri/target/release/bundle/macos/Restork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | tee "$RUNNER_TEMP/restork-codesign.txt"
          grep -q "^Signature=adhoc$" "$RUNNER_TEMP/restork-codesign.txt"
          ! grep -q "^Authority=Developer ID Application:" "$RUNNER_TEMP/restork-codesign.txt"
          codesign --display --entitlements :- "$app" 2>&1 | grep -q com.apple.security.automation.apple-events
      - name: Stage visibly labeled Alpha assets, SBOM, and updater metadata
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          mkdir -p dist/macos-alpha
          dmg="$(find desktop/src-tauri/target/release/bundle/dmg -maxdepth 1 -name '*.dmg' -print -quit)"
          archive="$(find desktop/src-tauri/target/release/bundle/macos -maxdepth 1 -name '*.app.tar.gz' -print -quit)"
          test -f "$dmg" && test -f "$archive" && test -f "$archive.sig"
          cp "$dmg" "dist/macos-alpha/Restork-${version}-macOS-arm64-UNSIGNED-ALPHA.dmg"
          cp "$archive" "dist/macos-alpha/Restork-${version}-macOS-arm64.app.tar.gz"
          cp "$archive.sig" "dist/macos-alpha/Restork-${version}-macOS-arm64.app.tar.gz.sig"
          uv run python scripts/generate_sbom.py --root . --output dist/macos-alpha/restork.cdx.json
          uv run python scripts/desktop_release.py manifest --directory dist/macos-alpha --repository "$GITHUB_REPOSITORY" --tag "$GITHUB_REF_NAME" --version "$version" --commit "$GITHUB_SHA" --channel alpha --trust ad-hoc
      - uses: actions/attest-build-provenance@43d14bc2b83dec42d39ecae14e916627a18bb661 # v3
        with:
          subject-path: dist/macos-alpha/*
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: restork-public-macos-alpha
          path: dist/macos-alpha/
          if-no-files-found: error
          retention-days: 30

  clean-machine-macos:
    needs: build-macos-alpha
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-public-macos-alpha
          path: candidate
      - name: Mount, verify ad-hoc identity, launch three times, and cleanly stop Core
        shell: bash
        run: |
          set -euo pipefail
          dmg="$(find candidate -name '*-UNSIGNED-ALPHA.dmg' -print -quit)"
          mount="$(mktemp -d)"
          trap 'hdiutil detach "$mount" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -nobrowse -readonly -mountpoint "$mount" "$dmg"
          app="$mount/Restork.app"
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign --display --verbose=4 "$app" 2>&1 | grep -q "^Signature=adhoc$"
          codesign --display --entitlements :- "$app" 2>&1 | grep -q com.apple.security.automation.apple-events
          ./scripts/smoke-desktop-app.sh 3 "$app"
          hdiutil detach "$mount"
          trap - EXIT
          rmdir "$mount"

  publish-alpha:
    needs: [build-macos-alpha, clean-machine-macos]
    runs-on: ubuntu-latest
    environment: release-publish
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: restork-public-macos-alpha
          path: dist/publish
      - name: Publish a clearly labeled Latest Alpha for the signed updater endpoint
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: >-
          gh release create "$GITHUB_REF_NAME" dist/publish/*
          --repo "$GITHUB_REPOSITORY" --verify-tag --latest
          --title "Restork $GITHUB_REF_NAME — UNSIGNED macOS Alpha"
          --notes-file docs/unsigned-alpha-release.md
