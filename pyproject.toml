[project]
name = "restork"
version = "0.1.2"
description = "A local-first agent workspace for research, study, and work."
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Restork contributors" }]
dependencies = [
  "cryptography>=46,<47",
  "defusedxml>=0.7.1,<0.8",
  "fastapi>=0.135,<0.136",
  "platformdirs>=4.3",
  "pydantic>=2.11",
  "uvicorn>=0.30,<0.31",
]

[project.scripts]
restork = "restork.cli:main"

[build-system]
requires = ["uv_build>=0.11.26,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
source-include = ["README.zh-CN.md", "assets/readme/**"]

[dependency-groups]
desktop = [
  "pyinstaller==6.21.0",
]
dev = [
  "bandit>=1.8",
  "httpx>=0.28",
  "mypy>=1.15",
  "pillow>=11.3",
  "pytest>=8.3",
  "ruff>=0.11",
  "types-defusedxml>=0.7.0.20260504",
]

[tool.pytest.ini_options]
addopts = "-ra -q"
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]

[tool.bandit]
targets = ["src"]
skips = ["B101"]
