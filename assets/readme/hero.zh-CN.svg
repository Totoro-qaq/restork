<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Restork — 有证据的工作，留在本机</title>
  <desc id="desc">赛博工作台把 GitHub、Hacker News 与已核验 X 证据通过 Restork Core 变成可审阅草稿和本地 Markdown。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061A24"/><stop offset=".48" stop-color="#08101E"/><stop offset="1" stop-color="#26102A"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27F3E5"/><stop offset=".48" stop-color="#8CD9F3"/><stop offset="1" stop-color="#FF4EB8"/></linearGradient>
    <pattern id="scan" width="16" height="16" patternUnits="userSpaceOnUse"><path d="M0 15.5H16" stroke="#BDEBF5" stroke-opacity=".055"/></pattern>
  </defs>
  <rect width="1200" height="400" rx="28" fill="url(#bg)"/><rect width="1200" height="400" rx="28" fill="url(#scan)"/>
  <path d="M0 2H420L520 2" stroke="url(#signal)" stroke-width="4"/><path d="M680 398H1200" stroke="url(#signal)" stroke-width="3" opacity=".7"/>
  <g fill="none" stroke="#27F3E5" stroke-opacity=".25"><path d="M46 104V342H94"/><path d="M1154 58V296L1116 334"/></g>
  <g transform="translate(72 58)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="0" y="18" fill="#70D7E6" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="14" letter-spacing="3">本地优先桌面工作台</text>
    <text x="0" y="105" fill="#F1FBFF" font-size="78" font-weight="800" letter-spacing="8">RESTORK</text>
    <rect x="0" y="128" width="460" height="3" fill="url(#signal)"/>
    <text x="0" y="176" fill="#D8F2F8" font-size="25" font-weight="650">研究、学习，把工作往前推。</text>
    <text x="0" y="218" fill="#8DB1C0" font-size="17">核验公开来源；每次写入都先给你看。</text>
    <text x="0" y="246" fill="#8DB1C0" font-size="17">知识始终是普通、可编辑的本地 Markdown。</text>
    <g transform="translate(0 286)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" font-weight="700" letter-spacing="1">
      <rect width="122" height="34" fill="#27F3E5" fill-opacity=".08" stroke="#27F3E5" stroke-opacity=".55"/><text x="18" y="22" fill="#65FFF3">RUST CORE</text>
      <rect x="136" width="150" height="34" fill="#FF4EB8" fill-opacity=".07" stroke="#FF4EB8" stroke-opacity=".5"/><text x="158" y="22" fill="#FF8BD0">先审阅再写</text>
      <rect x="300" width="148" height="34" fill="#8CD9F3" fill-opacity=".06" stroke="#8CD9F3" stroke-opacity=".45"/><text x="329" y="22" fill="#B9EFFF">本地笔记</text>
    </g>
  </g>
  <g transform="translate(626 48)" font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <path d="M0 0H462L490 28V286L466 310H0Z" fill="#071322" fill-opacity=".78" stroke="#3BD7E6" stroke-opacity=".42"/><path d="M0 54H490" stroke="url(#signal)" stroke-opacity=".7"/>
    <text x="24" y="33" fill="#A9D3DF" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12" letter-spacing="2">证据链路 / 只读</text>
    <g transform="translate(24 76)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <rect width="104" height="42" fill="#27F3E5" fill-opacity=".07" stroke="#27F3E5" stroke-opacity=".48"/><text x="17" y="26" fill="#BDEFF4">GITHUB</text>
      <rect y="54" width="104" height="42" fill="#27F3E5" fill-opacity=".05" stroke="#27F3E5" stroke-opacity=".38"/><text x="34" y="80" fill="#BDEFF4">HN</text>
      <rect y="108" width="104" height="42" fill="#FF4EB8" fill-opacity=".06" stroke="#FF4EB8" stroke-opacity=".45"/><text x="26" y="134" fill="#FFC0E3">X / GROK</text>
      <path d="M116 21H151M116 75H151M116 129H151M151 21V129M151 75H181" stroke="#6DDDE9" stroke-opacity=".55"/>
      <rect x="182" y="45" width="118" height="62" fill="#102338" stroke="#75E9F2" stroke-opacity=".6"/><text x="210" y="70" fill="#66FFF3">独立核验</text><text x="198" y="90" fill="#789EAE" font-size="10">链接 · 作者 · 正文</text>
      <path d="M300 76H331" stroke="#8CD9F3"/><path d="M324 70L332 76L324 82" stroke="#8CD9F3" fill="none"/>
      <rect x="332" y="18" width="110" height="42" fill="#FF4EB8" fill-opacity=".06" stroke="#FF4EB8" stroke-opacity=".48"/><text x="356" y="44" fill="#FFC0E3">三版草稿</text>
      <rect x="332" y="69" width="110" height="42" fill="#8CD9F3" fill-opacity=".05" stroke="#8CD9F3" stroke-opacity=".42"/><text x="362" y="95" fill="#C3EFFF">审批</text>
      <rect x="332" y="120" width="110" height="42" fill="#27F3E5" fill-opacity=".06" stroke="#27F3E5" stroke-opacity=".48"/><text x="347" y="146" fill="#65FFF3">MARKDOWN</text>
    </g>
    <g transform="translate(24 250)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="11"><circle cx="5" cy="-4" r="4" fill="#54F59B"/><text x="18" y="0" fill="#8DB1C0">不存在 X 写入路径</text><text x="245" y="0" fill="#FF8BD0">预览 → 确认 → 执行</text></g>
  </g>
</svg>
