<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Restork Core trust and evidence architecture</title>
  <desc id="desc">Local Markdown and explicit public sources enter one Rust Core. Policy, evidence verification and approvals gate every model request, tool call and local write.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061A24"/><stop offset=".52" stop-color="#080F1D"/><stop offset="1" stop-color="#27102A"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27F3E5"/><stop offset="1" stop-color="#FF4EB8"/></linearGradient>
    <pattern id="scan" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5H18" stroke="#BDEBF5" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><rect width="1200" height="560" rx="28" fill="url(#scan)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif">
    <text x="56" y="62" fill="#F1FBFF" font-size="30" font-weight="750">One Core. Visible evidence. Bounded effects.</text>
    <text x="56" y="91" fill="#7EA7B7" font-size="15">The Dashboard and CLI ask; the Rust Core decides, records and recovers.</text>
    <rect x="56" y="112" width="1088" height="3" fill="url(#signal)"/>
    <g transform="translate(56 146)">
      <text x="0" y="0" fill="#68EDE5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">INPUTS</text>
      <g transform="translate(0 24)" font-size="16">
        <rect width="230" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".45"/><text x="18" y="29" fill="#D9F5F8" font-weight="650">Local Markdown</text><text x="18" y="49" fill="#789EAE" font-size="12">Vault · Tasks · Profile</text>
        <rect y="78" width="230" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".38"/><text x="18" y="107" fill="#D9F5F8" font-weight="650">Public evidence</text><text x="18" y="127" fill="#789EAE" font-size="12">Web · GitHub · HN · verified X</text>
        <rect y="156" width="230" height="64" fill="#15152A" stroke="#FF4EB8" stroke-opacity=".42"/><text x="18" y="185" fill="#F7D7EA" font-weight="650">Your intent</text><text x="18" y="205" fill="#A98AA1" font-size="12">Mode · Model · Reasoning · Tools</text>
      </g>
      <path d="M246 133H314" stroke="#7FE8F0" stroke-width="2"/><path d="M306 126L316 133L306 140" fill="none" stroke="#7FE8F0" stroke-width="2"/>
    </g>
    <g transform="translate(374 146)">
      <text x="0" y="0" fill="#FF82CA" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">RESTORK CORE</text>
      <path d="M0 24H394L416 46V244L394 266H0Z" fill="#0A1423" fill-opacity=".9" stroke="#7FE8F0" stroke-opacity=".6"/>
      <g transform="translate(24 48)" font-size="15">
        <rect width="168" height="48" fill="#27F3E5" fill-opacity=".06" stroke="#27F3E5" stroke-opacity=".38"/><text x="16" y="29" fill="#D9F5F8">Run policy + budgets</text>
        <rect x="194" width="168" height="48" fill="#FF4EB8" fill-opacity=".06" stroke="#FF4EB8" stroke-opacity=".38"/><text x="210" y="29" fill="#F7D7EA">Evidence ledger</text>
        <rect y="66" width="168" height="48" fill="#27F3E5" fill-opacity=".05" stroke="#27F3E5" stroke-opacity=".35"/><text x="16" y="95" fill="#D9F5F8">Tool sandbox</text>
        <rect x="194" y="66" width="168" height="48" fill="#FF4EB8" fill-opacity=".05" stroke="#FF4EB8" stroke-opacity=".35"/><text x="210" y="95" fill="#F7D7EA">Preview + approval</text>
        <rect y="132" width="362" height="48" fill="#8CD9F3" fill-opacity=".05" stroke="#8CD9F3" stroke-opacity=".38"/><text x="16" y="161" fill="#CDEFF5">SQLite event history · retry · recovery</text>
      </g>
      <text x="24" y="244" fill="#63F89B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">EFFECTS REQUIRE A MATCHING, SINGLE-USE APPROVAL</text>
    </g>
    <g transform="translate(846 146)">
      <text x="0" y="0" fill="#68EDE5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">OUTPUTS</text>
      <path d="M-54 133H-8" stroke="#7FE8F0" stroke-width="2"/><path d="M-16 126L-6 133L-16 140" fill="none" stroke="#7FE8F0" stroke-width="2"/>
      <g transform="translate(0 24)" font-size="16">
        <rect width="298" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".45"/><text x="18" y="29" fill="#D9F5F8" font-weight="650">Research / Study / Work</text><text x="18" y="49" fill="#789EAE" font-size="12">Sources, paths, plans and handoffs</text>
        <rect y="78" width="298" height="64" fill="#15152A" stroke="#FF4EB8" stroke-opacity=".42"/><text x="18" y="107" fill="#F7D7EA" font-weight="650">Reviewable deliverables</text><text x="18" y="127" fill="#A98AA1" font-size="12">Reports · decks · three X drafts</text>
        <rect y="156" width="298" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".4"/><text x="18" y="185" fill="#D9F5F8" font-weight="650">Ordinary local files</text><text x="18" y="205" fill="#789EAE" font-size="12">Markdown you can inspect or delete</text>
      </g>
    </g>
    <g transform="translate(56 476)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <circle cx="5" cy="-4" r="4" fill="#54F59B"/><text x="18" y="0" fill="#9FC4CF">LOOPBACK ONLY</text>
      <circle cx="184" cy="-4" r="4" fill="#54F59B"/><text x="197" y="0" fill="#9FC4CF">NATIVE CREDENTIAL STORAGE</text>
      <circle cx="452" cy="-4" r="4" fill="#54F59B"/><text x="465" y="0" fill="#9FC4CF">NO X PUBLISHING PATH</text>
      <text x="860" y="0" fill="#FF8BD0">PREVIEW → CONFIRM → APPLY</text>
    </g>
  </g>
</svg>
