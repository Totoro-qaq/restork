<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc">
  <title id="title">Restork local-first agent workspace</title>
  <desc id="desc">A warm paper dashboard shows private Markdown entering one governed Core, four memory layers, a policy gate, and Research, Study, and Work modes.</desc>
  <defs>
    <linearGradient id="wordmark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F59E0B"/><stop offset="0.34" stop-color="#EC4899"/>
      <stop offset="0.68" stop-color="#8B5CF6"/><stop offset="1" stop-color="#22D3EE"/>
    </linearGradient>
    <linearGradient id="glass" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF" stop-opacity="0.94"/><stop offset="1" stop-color="#F7F0E4" stop-opacity="0.82"/>
    </linearGradient>
    <pattern id="rules" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M0 23.5H24" stroke="#A08F78" stroke-opacity="0.10"/>
    </pattern>
  </defs>
  <rect width="1200" height="400" rx="28" fill="#FBF8F1"/>
  <rect width="1200" height="400" rx="28" fill="url(#rules)"/>
  <circle cx="1035" cy="18" r="190" fill="#22D3EE" opacity="0.08"/>
  <circle cx="705" cy="405" r="230" fill="#8B5CF6" opacity="0.08"/>
  <path d="M48 48V352" stroke="#C0392F" stroke-opacity="0.20"/>

  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
    <text x="74" y="72" fill="#A08F78" font-size="13" font-weight="700" letter-spacing="2.4">LOCAL-FIRST AGENT WORKSPACE · MIT</text>
    <text x="70" y="151" fill="url(#wordmark)" font-family="American Typewriter, Courier New, monospace" font-size="76" font-weight="800" letter-spacing="5">RESTORK</text>
    <text x="74" y="198" fill="#3B3126" font-size="23" font-weight="650">One Core for Research, Study, and Work.</text>
    <text x="74" y="256" fill="#6B5D4B" font-size="17">Private Markdown stays local.</text>
    <text x="74" y="284" fill="#8D7C64" font-size="16">Preview writes. Govern every outbound request.</text>
    <g font-family="American Typewriter, Courier New, monospace" font-size="12" font-weight="700" letter-spacing="1.2">
      <rect x="74" y="326" width="126" height="32" rx="16" fill="#8B5CF6" opacity="0.12" stroke="#8B5CF6"/><text x="96" y="347" fill="#6D45D4">PYTHON CORE</text>
      <rect x="212" y="326" width="142" height="32" rx="16" fill="#22D3EE" opacity="0.14" stroke="#22AFC6"/><text x="232" y="347" fill="#167C89">LOCAL WEB UI</text>
      <rect x="366" y="326" width="132" height="32" rx="16" fill="#F59E0B" opacity="0.13" stroke="#D68806"/><text x="388" y="347" fill="#9B5B00">MARKDOWN</text>
    </g>
  </g>

  <g transform="translate(640 42)">
    <rect width="500" height="316" rx="22" fill="url(#glass)" stroke="#D8CCBB"/>
    <path d="M0 48H500" stroke="#D8CCBB" stroke-dasharray="4 5"/>
    <circle cx="26" cy="24" r="5" fill="#F59E0B"/><circle cx="44" cy="24" r="5" fill="#EC4899"/><circle cx="62" cy="24" r="5" fill="#22D3EE"/>
    <text x="86" y="29" fill="#6B5D4B" font-family="American Typewriter, Courier New, monospace" font-size="12" font-weight="700" letter-spacing="1.4">RESTORK CORE · 127.0.0.1</text>

    <g transform="translate(24 68)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <rect width="176" height="116" rx="14" fill="#FFFDF8" stroke="#D8CCBB"/>
      <text x="16" y="24" fill="#A08F78" font-family="American Typewriter, Courier New, monospace" font-size="10" font-weight="700" letter-spacing="1">FOUR-LAYER MEMORY</text>
      <g font-size="12" font-weight="650">
        <rect x="16" y="39" width="144" height="14" rx="7" fill="#8B5CF6" opacity="0.17"/><text x="22" y="50" fill="#5F3CAD">L0 · Working</text>
        <rect x="16" y="58" width="144" height="14" rx="7" fill="#EC4899" opacity="0.14"/><text x="22" y="69" fill="#A62D68">L1 · Episodic</text>
        <rect x="16" y="77" width="144" height="14" rx="7" fill="#22D3EE" opacity="0.17"/><text x="22" y="88" fill="#167C89">L2 · Semantic</text>
        <rect x="16" y="96" width="144" height="14" rx="7" fill="#F59E0B" opacity="0.16"/><text x="22" y="107" fill="#9B5B00">L3 · Profile</text>
      </g>
      <path d="M190 58H218" stroke="#8B5CF6" stroke-width="2"/><path d="M212 52L220 58L212 64" fill="none" stroke="#8B5CF6" stroke-width="2"/>
      <rect x="220" width="232" height="116" rx="14" fill="#3B3126"/>
      <text x="238" y="25" fill="#F7F0E4" font-family="American Typewriter, Courier New, monospace" font-size="11" font-weight="700" letter-spacing="1.2">POLICY GATE</text>
      <text x="238" y="50" fill="#FFFFFF" font-size="15" font-weight="700">MINIMUM CONTEXT</text>
      <text x="238" y="70" fill="#D8CCBB" font-size="11">scoped tools · token budget</text>
      <text x="238" y="85" fill="#D8CCBB" font-size="11">approval · audit trail</text>
      <rect x="238" y="92" width="174" height="17" rx="8.5" fill="#34D399" opacity="0.18"/>
      <text x="249" y="104" fill="#6EE7B7" font-family="American Typewriter, Courier New, monospace" font-size="8.5" font-weight="700">REVIEW BEFORE EFFECT</text>
    </g>

    <g transform="translate(24 206)" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, sans-serif">
      <path d="M60 44H390" stroke="#A08F78" stroke-width="2" stroke-dasharray="3 4"/><path d="M383 38L393 44L383 50" fill="none" stroke="#A08F78" stroke-width="2"/>
      <g transform="translate(0 4)"><rect width="124" height="76" rx="13" fill="#8B5CF6" opacity="0.13" stroke="#8B5CF6"/><text x="18" y="31" fill="#6D45D4" font-family="American Typewriter, Courier New, monospace" font-size="24" font-weight="800">R</text><text x="48" y="30" fill="#3B3126" font-size="14" font-weight="700">Research</text><text x="18" y="57" fill="#6B5D4B" font-size="11">claims + evidence</text></g>
      <g transform="translate(164 4)"><rect width="124" height="76" rx="13" fill="#22D3EE" opacity="0.13" stroke="#22AFC6"/><text x="18" y="31" fill="#167C89" font-family="American Typewriter, Courier New, monospace" font-size="24" font-weight="800">S</text><text x="48" y="30" fill="#3B3126" font-size="14" font-weight="700">Study</text><text x="18" y="57" fill="#6B5D4B" font-size="11">recall + review</text></g>
      <g transform="translate(328 4)"><rect width="124" height="76" rx="13" fill="#F59E0B" opacity="0.13" stroke="#D68806"/><text x="18" y="31" fill="#9B5B00" font-family="American Typewriter, Courier New, monospace" font-size="24" font-weight="800">W</text><text x="48" y="30" fill="#3B3126" font-size="14" font-weight="700">Work</text><text x="18" y="57" fill="#6B5D4B" font-size="11">plan + handoff</text></g>
    </g>
  </g>
</svg>
