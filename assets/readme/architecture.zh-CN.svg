<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Restork 四层记忆与受控出站架构</title>
  <desc id="desc">四个本地记忆层在 Restork Core 内选择最少必要上下文；Markdown 与私有画像保持为真相来源，每次云端请求都经过策略门。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFDF8"/><stop offset="1" stop-color="#F7F0E4"/>
    </linearGradient>
    <pattern id="rules" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M0 27.5H28" stroke="#A08F78" stroke-opacity="0.09"/>
    </pattern>
  </defs>
  <rect width="1200" height="560" rx="26" fill="#FBF8F1"/>
  <rect width="1200" height="560" rx="26" fill="url(#rules)"/>
  <path d="M48 36V524" stroke="#C0392F" stroke-opacity="0.18"/>
  <g font-family="-apple-system, BlinkMacSystemFont, Segoe UI, PingFang SC, Microsoft YaHei, sans-serif">
    <text x="72" y="62" fill="#3B3126" font-family="American Typewriter, Courier New, PingFang SC, monospace" font-size="27" font-weight="800" letter-spacing="1.5">四层记忆 · 本地真相，受控上下文</text>
    <text x="72" y="90" fill="#6B5D4B" font-size="15">记忆负责选择上下文，而不是制造第二份知识真相。</text>

    <g transform="translate(72 122)">
      <g>
        <rect width="246" height="142" rx="16" fill="url(#paper)" stroke="#8B5CF6"/><rect width="246" height="8" rx="4" fill="#8B5CF6"/>
        <text x="18" y="42" fill="#6D45D4" font-family="American Typewriter, Courier New, monospace" font-size="13" font-weight="800">L0 · 工作记忆</text>
        <text x="18" y="69" fill="#3B3126" font-size="17" font-weight="700">当前对话窗口</text>
        <text x="18" y="93" fill="#6B5D4B" font-size="13">最近轮次 · Token 预算</text>
        <text x="18" y="115" fill="#6B5D4B" font-size="13">可选加密 TTL 摘要</text>
        <text x="18" y="132" fill="#A08F78" font-size="11">临时数据</text>
      </g>
      <g transform="translate(270)">
        <rect width="246" height="142" rx="16" fill="url(#paper)" stroke="#EC4899"/><rect width="246" height="8" rx="4" fill="#EC4899"/>
        <text x="18" y="42" fill="#A62D68" font-family="American Typewriter, Courier New, monospace" font-size="13" font-weight="800">L1 · 情景记忆</text>
        <text x="18" y="69" fill="#3B3126" font-size="17" font-weight="700">运行、决策与摘要</text>
        <text x="18" y="93" fill="#6B5D4B" font-size="13">运行 · 尝试 · 决策</text>
        <text x="18" y="115" fill="#6B5D4B" font-size="13">SQLite 元数据与来源</text>
        <text x="18" y="132" fill="#A08F78" font-size="11">显式保留</text>
      </g>
      <g transform="translate(540)">
        <rect width="246" height="142" rx="16" fill="url(#paper)" stroke="#22AFC6"/><rect width="246" height="8" rx="4" fill="#22D3EE"/>
        <text x="18" y="42" fill="#167C89" font-family="American Typewriter, Courier New, monospace" font-size="13" font-weight="800">L2 · 语义记忆</text>
        <text x="18" y="69" fill="#3B3126" font-size="17" font-weight="700">Markdown 知识与链接</text>
        <text x="18" y="93" fill="#6B5D4B" font-size="13">笔记 · 标题 · Wiki 链接</text>
        <text x="18" y="115" fill="#6B5D4B" font-size="13">可重建的搜索投影</text>
        <text x="18" y="132" fill="#A08F78" font-size="11">MARKDOWN 真相</text>
      </g>
      <g transform="translate(810)">
        <rect width="246" height="142" rx="16" fill="url(#paper)" stroke="#D68806"/><rect width="246" height="8" rx="4" fill="#F59E0B"/>
        <text x="18" y="42" fill="#9B5B00" font-family="American Typewriter, Courier New, monospace" font-size="13" font-weight="800">L3 · 用户画像</text>
        <text x="18" y="69" fill="#3B3126" font-size="17" font-weight="700">用户明确配置</text>
        <text x="18" y="93" fill="#6B5D4B" font-size="13">语言 · 偏好 · 规则</text>
        <text x="18" y="115" fill="#6B5D4B" font-size="13">私有 TOML 与指令</text>
        <text x="18" y="132" fill="#A08F78" font-size="11">用户编写</text>
      </g>
    </g>

    <g transform="translate(72 294)">
      <path d="M123 0V24M393 0V24M663 0V24M933 0V24" stroke="#A08F78" stroke-width="2"/>
      <path d="M123 24H933" stroke="#A08F78" stroke-width="2" stroke-dasharray="4 5"/>
      <path d="M528 24V48" stroke="#A08F78" stroke-width="2"/><path d="M522 40L528 49L534 40" fill="none" stroke="#A08F78" stroke-width="2"/>
      <rect y="48" width="780" height="108" rx="17" fill="#3B3126"/>
      <text x="22" y="77" fill="#F7F0E4" font-family="American Typewriter, Courier New, PingFang SC, monospace" font-size="13" font-weight="800" letter-spacing="1.2">上下文选择器 · 位于本地 CORE</text>
      <text x="22" y="106" fill="#FFFFFF" font-size="18" font-weight="700">最近轮次 + 显式画像 + 本地检索</text>
      <text x="22" y="130" fill="#D8CCBB" font-size="14">确定性 Token 预算 · 已选 ID · 来源引用 · 最高数据级别</text>
      <rect x="604" y="69" width="150" height="58" rx="12" fill="#FFFFFF" opacity="0.10" stroke="#D8CCBB"/>
      <text x="624" y="92" fill="#6EE7B7" font-family="American Typewriter, Courier New, monospace" font-size="11" font-weight="800">清单</text>
      <text x="624" y="113" fill="#FFFFFF" font-size="12">发送前可审阅</text>

      <path d="M780 102H826" stroke="#EC4899" stroke-width="3"/><path d="M817 94L829 102L817 110" fill="none" stroke="#EC4899" stroke-width="3"/>
      <rect x="832" y="48" width="224" height="108" rx="17" fill="#FFFDF8" stroke="#EC4899" stroke-width="2"/>
      <text x="854" y="77" fill="#A62D68" font-family="American Typewriter, Courier New, monospace" font-size="12" font-weight="800">出站网关</text>
      <text x="854" y="103" fill="#3B3126" font-size="15" font-weight="700">精确来源 · 范围 · 大小</text>
      <text x="854" y="126" fill="#6B5D4B" font-size="12">策略 · 审批 · 审计</text>
      <text x="854" y="145" fill="#A08F78" font-size="10">仅在允许时访问云端</text>
    </g>

    <g transform="translate(72 474)">
      <rect width="1056" height="52" rx="14" fill="#FFFFFF" opacity="0.70" stroke="#D8CCBB"/>
      <text x="20" y="22" fill="#3B3126" font-family="American Typewriter, Courier New, monospace" font-size="12" font-weight="800">真相来源</text>
      <text x="20" y="41" fill="#6B5D4B" font-size="12">Markdown + 私有画像</text>
      <path d="M242 26H286" stroke="#A08F78" stroke-dasharray="3 3"/>
      <text x="306" y="22" fill="#3B3126" font-family="American Typewriter, Courier New, monospace" font-size="12" font-weight="800">运行状态</text>
      <text x="306" y="41" fill="#6B5D4B" font-size="12">SQLite 运行 · 审批 · 缓存</text>
      <path d="M572 26H616" stroke="#A08F78" stroke-dasharray="3 3"/>
      <text x="636" y="22" fill="#3B3126" font-family="American Typewriter, Courier New, monospace" font-size="12" font-weight="800">可重建</text>
      <text x="636" y="41" fill="#6B5D4B" font-size="12">FTS · 链接 · 可选向量</text>
      <rect x="876" y="11" width="158" height="30" rx="15" fill="#34D399" opacity="0.15" stroke="#2BAE7A"/>
      <text x="903" y="31" fill="#1E8A56" font-family="American Typewriter, Courier New, monospace" font-size="10" font-weight="800">无需图数据库</text>
    </g>
  </g>
</svg>
