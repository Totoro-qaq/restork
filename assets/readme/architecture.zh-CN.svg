<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">Restork Core 的信任与证据架构</title>
  <desc id="desc">本地 Markdown 与明确选择的公开来源进入同一个 Rust Core；策略、证据核验和审批共同约束模型请求、工具调用与本地写入。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#061A24"/><stop offset=".52" stop-color="#080F1D"/><stop offset="1" stop-color="#27102A"/></linearGradient>
    <linearGradient id="signal" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#27F3E5"/><stop offset="1" stop-color="#FF4EB8"/></linearGradient>
    <pattern id="scan" width="18" height="18" patternUnits="userSpaceOnUse"><path d="M0 17.5H18" stroke="#BDEBF5" stroke-opacity=".045"/></pattern>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/><rect width="1200" height="560" rx="28" fill="url(#scan)"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC',sans-serif">
    <text x="56" y="62" fill="#F1FBFF" font-size="30" font-weight="750">一个 Core，可见的证据，受约束的副作用。</text>
    <text x="56" y="91" fill="#7EA7B7" font-size="15">Dashboard 与 CLI 发出请求；Rust Core 决策、记录并负责恢复。</text>
    <rect x="56" y="112" width="1088" height="3" fill="url(#signal)"/>
    <g transform="translate(56 146)">
      <text x="0" y="0" fill="#68EDE5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">输入</text>
      <g transform="translate(0 24)" font-size="16">
        <rect width="230" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".45"/><text x="18" y="29" fill="#D9F5F8" font-weight="650">本地 Markdown</text><text x="18" y="49" fill="#789EAE" font-size="12">知识库 · 任务 · 偏好</text>
        <rect y="78" width="230" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".38"/><text x="18" y="107" fill="#D9F5F8" font-weight="650">公开证据</text><text x="18" y="127" fill="#789EAE" font-size="12">Web · GitHub · HN · 已核验 X</text>
        <rect y="156" width="230" height="64" fill="#15152A" stroke="#FF4EB8" stroke-opacity=".42"/><text x="18" y="185" fill="#F7D7EA" font-weight="650">你的意图</text><text x="18" y="205" fill="#A98AA1" font-size="12">模式 · 模型 · 思考强度 · 工具</text>
      </g>
      <path d="M246 133H314" stroke="#7FE8F0" stroke-width="2"/><path d="M306 126L316 133L306 140" fill="none" stroke="#7FE8F0" stroke-width="2"/>
    </g>
    <g transform="translate(374 146)">
      <text x="0" y="0" fill="#FF82CA" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">RESTORK CORE</text>
      <path d="M0 24H394L416 46V244L394 266H0Z" fill="#0A1423" fill-opacity=".9" stroke="#7FE8F0" stroke-opacity=".6"/>
      <g transform="translate(24 48)" font-size="15">
        <rect width="168" height="48" fill="#27F3E5" fill-opacity=".06" stroke="#27F3E5" stroke-opacity=".38"/><text x="16" y="29" fill="#D9F5F8">运行策略与预算</text>
        <rect x="194" width="168" height="48" fill="#FF4EB8" fill-opacity=".06" stroke="#FF4EB8" stroke-opacity=".38"/><text x="210" y="29" fill="#F7D7EA">证据账本</text>
        <rect y="66" width="168" height="48" fill="#27F3E5" fill-opacity=".05" stroke="#27F3E5" stroke-opacity=".35"/><text x="16" y="95" fill="#D9F5F8">工具沙箱</text>
        <rect x="194" y="66" width="168" height="48" fill="#FF4EB8" fill-opacity=".05" stroke="#FF4EB8" stroke-opacity=".35"/><text x="210" y="95" fill="#F7D7EA">预览与审批</text>
        <rect y="132" width="362" height="48" fill="#8CD9F3" fill-opacity=".05" stroke="#8CD9F3" stroke-opacity=".38"/><text x="16" y="161" fill="#CDEFF5">SQLite 事件历史 · 重试 · 恢复</text>
      </g>
      <text x="24" y="244" fill="#63F89B" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">副作用必须匹配一次性审批</text>
    </g>
    <g transform="translate(846 146)">
      <text x="0" y="0" fill="#68EDE5" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" letter-spacing="2">输出</text>
      <path d="M-54 133H-8" stroke="#7FE8F0" stroke-width="2"/><path d="M-16 126L-6 133L-16 140" fill="none" stroke="#7FE8F0" stroke-width="2"/>
      <g transform="translate(0 24)" font-size="16">
        <rect width="298" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".45"/><text x="18" y="29" fill="#D9F5F8" font-weight="650">研究 / 学习 / 工作</text><text x="18" y="49" fill="#789EAE" font-size="12">来源、路径、计划与交接</text>
        <rect y="78" width="298" height="64" fill="#15152A" stroke="#FF4EB8" stroke-opacity=".42"/><text x="18" y="107" fill="#F7D7EA" font-weight="650">可审阅交付物</text><text x="18" y="127" fill="#A98AA1" font-size="12">报告 · 演示文稿 · 三版 X 草稿</text>
        <rect y="156" width="298" height="64" fill="#0C1C2B" stroke="#27F3E5" stroke-opacity=".4"/><text x="18" y="185" fill="#D9F5F8" font-weight="650">普通本地文件</text><text x="18" y="205" fill="#789EAE" font-size="12">你能检查、编辑或删除的 Markdown</text>
      </g>
    </g>
    <g transform="translate(56 476)" font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="12">
      <circle cx="5" cy="-4" r="4" fill="#54F59B"/><text x="18" y="0" fill="#9FC4CF">仅监听 LOOPBACK</text>
      <circle cx="220" cy="-4" r="4" fill="#54F59B"/><text x="233" y="0" fill="#9FC4CF">原生凭据存储</text>
      <circle cx="420" cy="-4" r="4" fill="#54F59B"/><text x="433" y="0" fill="#9FC4CF">不存在 X 发布路径</text>
      <text x="860" y="0" fill="#FF8BD0">预览 → 确认 → 执行</text>
    </g>
  </g>
</svg>
