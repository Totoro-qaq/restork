[package]
name = "restork-api"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
axum.workspace = true
chrono.workspace = true
chrono-tz.workspace = true
futures-util.workspace = true
getrandom.workspace = true
restork-automation = { path = "../restork-automation" }
restork-core = { path = "../restork-core" }
restork-daily = { path = "../restork-daily" }
restork-deliverables = { path = "../restork-deliverables" }
restork-extension = { path = "../restork-extension" }
restork-personal = { path = "../restork-personal" }
restork-provider = { path = "../restork-provider" }
restork-render = { path = "../restork-render" }
restork-storage = { path = "../restork-storage" }
restork-worker = { path = "../restork-worker" }
rust-embed.workspace = true
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
sha2.workspace = true
time = { workspace = true, features = ["formatting", "parsing"] }
tokio = { workspace = true, features = ["rt", "sync", "time"] }
url.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Storage_FileSystem"] }

[dev-dependencies]
http-body-util.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
tower = { workspace = true, features = ["util"] }

[lib]
name = "restork_api"
path = "src/lib.rs"
