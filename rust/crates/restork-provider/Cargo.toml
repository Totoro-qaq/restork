[package]
name = "restork-provider"
version = "0.1.0"
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
bytes = "=1.12.1"
futures-util.workspace = true
getrandom.workspace = true
httpdate = "=1.0.3"
reqwest = { workspace = true, default-features = false, features = ["json", "rustls", "stream"] }
restork-personal = { path = "../restork-personal", version = "=0.1.0" }
serde = { workspace = true, features = ["derive"] }
serde_json.workspace = true
tokio = { workspace = true, features = ["process", "time"] }
tiktoken-rs = "=0.12.0"
url.workspace = true
zeroize.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security_Credentials",
] }

[dev-dependencies]
axum.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "sync"] }
