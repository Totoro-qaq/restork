[workspace]
members = [
    "crates/restork-api",
    "crates/restork-automation",
    "crates/restork-core",
    "crates/restork-daily",
    "crates/restork-deliverables",
    "crates/restork-extension",
    "crates/restork-personal",
    "crates/restork-provider",
    "crates/restork-storage",
    "crates/restork-worker",
    "crates/restorkd",
]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
axum = "=0.8.9"
chrono = "=0.4.45"
chrono-tz = "=0.10.4"
futures-util = "=0.3.33"
getrandom = "=0.4.3"
http-body-util = "=0.1.4"
libc = "=0.2.189"
rusqlite = "=0.40.1"
reqwest = { version = "=0.13.4", default-features = false }
rust-embed = "=8.12.0"
serde = "=1.0.229"
serde_json = "=1.0.151"
sha2 = "=0.11.0"
subtle = "=2.6.1"
time = "=0.3.55"
tokio = "=1.53.1"
tower = "=0.5.3"
url = "=2.5.8"
windows-sys = "=0.61.2"
zeroize = "=1.9.0"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
