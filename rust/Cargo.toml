[workspace]
members = ["crates/restork-api", "crates/restork-core", "crates/restorkd"]
resolver = "3"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[workspace.dependencies]
axum = "=0.8.9"
getrandom = "=0.4.3"
http-body-util = "=0.1.4"
libc = "=0.2.189"
serde = "=1.0.229"
serde_json = "=1.0.151"
subtle = "=2.6.1"
time = "=0.3.55"
tokio = "=1.53.1"
tower = "=0.5.3"
url = "=2.5.8"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
