[package]
name = "restork-desktop"
version = "0.1.2"
description = "Cross-platform native lifecycle supervisor for Restork"
authors = ["Restork contributors"]
edition = "2024"
license = "MIT"
rust-version = "1.97.1"

[lib]
name = "restork_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "restork"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
tauri = { version = "=2.11.5", features = [] }
tauri-plugin-single-instance = "=2.4.3"
tauri-plugin-updater = "=2.10.1"

[target.'cfg(unix)'.dependencies]
libc = "=0.2.189"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "=0.61.2", features = [
  "Win32_Foundation",
  "Win32_Security",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
